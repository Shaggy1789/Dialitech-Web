# Deploy settings
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Functions configuration
[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# Security headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "cross-origin"
    # Content-Security-Policy de producción (Vue 3 + ECharts + Netlify proxy).
    # - script-src 'self': sin eval ni inline (Vite build estático).
    # - style-src 'unsafe-inline': requerido por ECharts/zrender (tooltips, estilos de contenedores).
    # - connect-src: solo mismo origen (/api/v1 y /ml son proxys server-side de Netlify)
    #   + origen del backend por si VITE_API_URL se define en un build puntual.
    # - La API key de ML NUNCA viaja al navegador (se inyecta server-side en ml-proxy).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api-dialitech-core-v2.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Proxy API calls to the Render backend via the same origin,
# so the browser never makes a cross-origin request and CORS is bypassed.
[[redirects]]
  from = "/api/v1/*"
  to = "https://api-dialitech-core-v2.onrender.com/api/v1/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# ML Service proxy via Netlify Function (server-side API key injection)
# Nueva ruta /api/ml/* (consistente con /api/v1/*)
[[redirects]]
  from = "/api/ml/*"
  to = "/.netlify/functions/ml-proxy/:splat"
  status = 200
  force = true

# Ruta legacy /ml/* (mantener compatibilidad temporal)
[[redirects]]
  from = "/ml/*"
  to = "/.netlify/functions/ml-proxy/:splat"
  status = 200
  force = true

# SPA fallback for history-mode routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200